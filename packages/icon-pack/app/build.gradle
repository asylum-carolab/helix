plugins { id 'com.android.application' }

android {
    namespace 'fr.carolab.helix.icons'
    compileSdk 35
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'fr.carolab.helix.icons'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-icons01'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {}

tasks.named('preBuild') {
    dependsOn rootProject.tasks.named('verifyIconResources')
}

// Export only after a successful assembly; keep the normal Gradle output as well.
tasks.matching { it.name == 'assembleDebug' }.configureEach {
    doLast {
        copy {
            from layout.buildDirectory.file('outputs/apk/debug/app-debug.apk')
            into rootProject.file('..')
            rename { 'HELIX-Icon-Pack-ICONS01-38.apk' }
        }
    }
}
